name: Build Android APK

# Собирает APK в облаке GitHub — локальный компьютер не нагружается.
on:
  push:
    branches: ["**"]
  workflow_dispatch: # ручной запуск кнопкой в разделе Actions

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: texfi-files-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Публикуем APK в Release, чтобы качать прямой ссылкой с телефона.
      - name: Publish to "latest-apk" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: TexFi files APK (свежая сборка)
          prerelease: true
          files: build/app/outputs/flutter-apk/app-release.apk
